# Development profile
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.iuh.chillteam=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Safe local defaults for development only
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Local fallback secret for development only
jwt.secret=${JWT_SECRET:ChillGlassesSecretKeyForJWTTokenGenerationAndValidation2024MinLength256Bits}
